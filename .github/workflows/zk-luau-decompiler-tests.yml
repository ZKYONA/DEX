name: ZK Luau Decompiler tests

on:
  push:
    paths:
      - "tools/zk_luau_decompiler.py"
      - "tools/tests/**"
      - ".github/workflows/zk-luau-decompiler-tests.yml"
  pull_request:
    paths:
      - "tools/zk_luau_decompiler.py"
      - "tools/tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tools/tests
